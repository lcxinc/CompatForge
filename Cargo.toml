[workspace]
resolver = "2"
members = [
  "apps/cli",
  "crates/compatforge-domain",
  "crates/compatforge-storage",
  "crates/compatforge-orchestrator",
  "crates/compatforge-ffi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
